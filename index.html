<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">Campus Lost & Found Portal</h1>

    <!-- Login Section -->

    <div class="card p-4 mb-4">

        <h3>User Login</h3>

        <input type="text" id="username" class="form-control mb-3" placeholder="Enter Username">

        <input type="password" id="password" class="form-control mb-3" placeholder="Enter Password">

        <button class="btn btn-primary" onclick="login()">Login</button>

    </div>

    <!-- Main Portal -->

    <div id="portalSection" style="display:none;">

        <!-- Add Item -->

        <div class="card p-4 mb-4">

            <h3>Post Lost / Found Item</h3>

            <input type="text" id="itemName" class="form-control mb-3" placeholder="Item Name">

            <textarea id="description" class="form-control mb-3" placeholder="Description"></textarea>

            <input type="text" id="location" class="form-control mb-3" placeholder="Location">

            <select id="status" class="form-control mb-3">

                <option value="Lost">Lost</option>
                <option value="Found">Found</option>

            </select>

            <button class="btn btn-success" onclick="addItem()">Post Item</button>

        </div>

        <!-- Search -->

        <input type="text" id="search" class="form-control mb-4" placeholder="Search Items" onkeyup="searchItems()">

        <!-- Display Items -->

        <div id="itemsContainer"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
